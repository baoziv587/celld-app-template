# Everything Kubernetes knows about the "template-worker" worker.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cells
namePrefix: template-worker-
resources:
  - ../../fleet
labels:
  - pairs:
      app.kubernetes.io/instance: template-worker
    includeSelectors: true
configMapGenerator:
  - name: fleet
    literals:
      # Must match the bucket prefix that `pnpm manage deploy template-worker` publishes to.
      - CELLD_BUCKET=s3://cells/template-worker
replicas:
  - name: celld
    count: 2
patches:
  - target: {kind: Ingress, name: celld}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: template-worker.example.com
