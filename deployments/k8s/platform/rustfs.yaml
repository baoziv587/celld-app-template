apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
        - name: rustfs
          # Pin a release tag or digest before production use.
          image: rustfs/rustfs:latest
          args: [/data]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: celld-storage-credentials, key: AWS_ACCESS_KEY_ID}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: celld-storage-credentials, key: AWS_SECRET_ACCESS_KEY}
            - name: RUSTFS_ADDRESS
              value: ':9000'
            - name: RUSTFS_CONSOLE_ENABLE
              value: 'false'
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: error
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health, port: api}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
