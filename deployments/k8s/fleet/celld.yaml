apiVersion: v1
kind: Service
metadata:
  name: celld
spec:
  selector:
    app.kubernetes.io/name: celld
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celld
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
---
# 8081 is an unauthenticated operator API: only pods of the same fleet may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celld
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: celld
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: celld
      ports:
        - port: internal
---
# Nodes are disposable: the bucket is the durable truth, so a plain Deployment
# with scratch disk is enough. A restarted node restores cells on demand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld
spec:
  replicas: 2
  # celld versions must not mix in one fleet, so a template change replaces all
  # nodes at once. It only happens on a runtime upgrade; code releases never restart pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld
    spec:
      # Must exceed CELLD_SHUTDOWN_TOTAL_MS (default 40 s) so cells hand off before SIGKILL.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: celld
      containers:
        - name: celld
          image: ghcr.io/denoland/celld
          args:
            - --listen
            - 0.0.0.0:8080
            - --internal-listen
            - 0.0.0.0:8081
            - --advertise
            - $(POD_IP):8081
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: CELLD_WATCH
              value: /var/lib/celld/state
          envFrom:
            # CELLD_BUCKET, from the worker overlay
            - configMapRef: {name: fleet}
            # S3_ENDPOINT, AWS_REGION and credentials, from the platform
            - configMapRef: {name: celld-storage}
            - secretRef: {name: celld-storage-credentials}
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          startupProbe:
            httpGet: {path: /.well-known/celld/health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /.well-known/celld/health, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # Health also reports 503 while draining, so liveness stays patient.
            httpGet: {path: /.well-known/celld/health, port: http}
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - name: state
              mountPath: /var/lib/celld
      volumes:
        - name: state
          emptyDir: {}
---
# celld's public listener reserves only /.well-known/celld/health, so the whole host routes to it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: celld
spec:
  rules:
    - host: set-by-worker-overlay.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celld
                port:
                  name: http
