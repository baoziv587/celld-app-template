# Everything Kubernetes knows about the "notes" worker.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cells
namePrefix: notes-
resources:
  - ../../fleet
labels:
  - pairs:
      app.kubernetes.io/instance: notes
    includeSelectors: true
configMapGenerator:
  - name: fleet
    literals:
      # Must match the bucket prefix that `pnpm deploy:worker notes` publishes to.
      - CELLD_BUCKET=s3://cells/notes
replicas:
  - name: celld
    count: 2
patches:
  - target: {kind: Ingress, name: celld}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: notes.example.com
